name: Continuous Delivery (CD) & Container Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: ['Continue Integration (CI)']
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # Job 1: Build & Push Docker Image to GHCR
  build-and-push-ghcr:
    name: Build & Push Container Image to GHCR
    #Trigger when pushing a tag version or when the CI workflow completes successfully
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    #Declare output to share the image tag with other jobs
    outputs:
      image_tag: ${{steps.set-tag.outputs.image_tag}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # GitHub’s runners use x86 (amd64) CPUs. QEMU allows the runner to simulate other CPU architectures like ARM64 (linux/arm64). This enables you to build container images that run natively on Apple Silicon MacBooks (M1/M2/M3) or ARM cloud servers (like AWS Graviton) without hardware errors.
      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v4

      # tandard docker build lacks support for multi-platform outputs, advanced layer caching, and automatic metadata labeling. Buildx unlocks these features (including the cache-from/cache-to options used in step 6).
      - name: set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ghcr.io requires the image reference to be lowercase, but github.repository
      # preserves the repository's actual case, so it must be lowercased here.
      - name: Set image tag output
        id: set-tag
        run: echo "image_tag=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # Job 2: Trivy Container Vulnerability Scan
  trivy-security-scan:
    name: Container Vulnerability Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Scan using the exact SHA tag pushed in Job 1
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ needs.build-and-push-ghcr.outputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Gate: fail this job on CRITICAL vulnerabilities that have a known fix available.
      # Runs after the report above so the Security tab always gets the full picture,
      # regardless of whether this gate passes. Deploy depends on this job succeeding.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ needs.build-and-push-ghcr.outputs.image_tag }}'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # Job 3: Deploy to Production AWS EC2 Host
  deploy:
    name: Deploy to Production (AWS EC2)
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr, trivy-security-scan]
    # References GitHub Environment "production" for approval gate & environment-specific secrets
    environment: production
    steps:
      - name: Deploy container to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Authenticate with GitHub Container Registry on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the exact container image tag produced by build-and-push-ghcr
            docker pull ${{ needs.build-and-push-ghcr.outputs.image_tag }}

            # 3. Gracefully stop and remove the old running container (if present)
            docker stop cat-app || true
            docker rm cat-app || true

            # 4. Start the new container on port 80 with auto-restart on system reboot
            docker run -d \
              --name cat-app \
              --restart always \
              -p 80:80 \
              ${{ needs.build-and-push-ghcr.outputs.image_tag }}

            # 5. Clean up old/unused images to keep EC2 storage low
            docker image prune -f
