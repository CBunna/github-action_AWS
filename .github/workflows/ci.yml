name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: read

jobs:
  # ----------------------------------------------------
  # Job 1: Code Quality & Security Audit
  # ----------------------------------------------------
  code-quality:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier formatting check
        run: npm run format:check

      - name: Run security audit for dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  # ----------------------------------------------------
  # Job 2: Automated Unit & Component Tests
  # ----------------------------------------------------
  unit-and-component-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm run test

  # ----------------------------------------------------
  # Job 3: Application Production Build
  # ----------------------------------------------------
  build-application:
    name: Build Production Assets
    runs-on: ubuntu-latest
    needs: unit-and-component-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static production bundle
        run: npm run build

      - name: Upload build output artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-bundle
          path: dist/
          retention-days: 7

  # ----------------------------------------------------
  # Job 4: Docker Container Build Verification
  # ----------------------------------------------------
  docker-build-test:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: build-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cat-shop:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
